# Local development infrastructure for VersionWise AI.
# App services (backend/frontend) run on the host for fast iteration;
# compose provides stateful dependencies only.
name: versionwise-ai

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: versionwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: versionwise
      POSTGRES_PASSWORD: versionwise
      POSTGRES_DB: versionwise
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U versionwise -d versionwise"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: versionwise-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: versionwise-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/versionwise-documents || true;
      exit 0;
      "

volumes:
  postgres-data:
  minio-data:
